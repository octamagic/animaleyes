[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animaleyes"
version = "0.1.0"
description = "Watches a Kasa camera over a PetLibro Polar feeder and opens it only for Grrr."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.60",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pillow>=10.0",
  "python-dotenv>=1.0",
  "tomli-w>=1.0",
  "python-kasa>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]
yolo = ["ultralytics>=8.3"]  # local detector backend (IDENTIFIER=yolo); pulls in torch

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
animaleyes = "animaleyes.main:main"

[tool.setuptools.packages.find]
include = ["animaleyes*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["petlibro-cli"]  # vendored verbatim from ~/code/petlibro-cli; not ours to lint

[tool.ruff.lint.per-file-ignores]
"animaleyes/dashboard.py" = ["E501"]  # inline HTML/JS template
"animaleyes/events.py" = ["E501"]     # long ONVIF namespace URIs
"animaleyes/ptz.py" = ["E501"]        # long ONVIF namespace URIs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["animaleyes"]
